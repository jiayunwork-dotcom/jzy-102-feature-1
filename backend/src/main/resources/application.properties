server.port=8080
# 高度场 JSON 请求体可能达到数 MB（512x512 个 double），放宽 Tomcat 请求限制
server.tomcat.max-http-form-post-size=50MB
server.max-http-request-header-size=64KB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.max-file-size=50MB

# 河网稳态判定阈值：相邻两帧归一化汇流场的总变差距离（∈ (0,1)）低于此值即判稳态
terrain.steady-threshold=0.02
